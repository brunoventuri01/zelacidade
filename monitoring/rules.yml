groups:
  - name: zelacidade
    rules:
      - alert: ZelaCidadeHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="zelacidade-api",status=~"5.."}[2m]))
          / clamp_min(sum(rate(http_requests_total{job="zelacidade-api"}[2m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erros HTTP acima de 5%"
      - alert: ZelaCidadeHostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU do host acima de 85%"
