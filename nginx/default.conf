server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name 200.187.67.91;
  ssl_certificate /etc/letsencrypt/live/200.187.67.91/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/200.187.67.91/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 10m;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /docs { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }
  location /health { proxy_pass http://backend:8000; }
  location / { proxy_pass http://frontend:80; }
}
