# Para reproduzir e testar o MVP no PC. Em produção, o Azure roda só a imagem do serviço app
# e o banco é o Postgres do Neon, configurado nos App Settings (DATABASE_URL).
#
#   cp .env.example .env    # troque os CHANGE_ME por valores locais
#   docker compose up --build
#   docker compose exec app python -m app.seed --quantidade 200 --semente 42 --limpar
#
# Monitoramento local (Prometheus + Grafana): docker compose --profile monitoring up

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ROBOT_API_KEY: ${ROBOT_API_KEY}
      RPA_API_KEY: ${RPA_API_KEY}
      EXPORT_API_KEY: ${EXPORT_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      HASH_SALT: ${HASH_SALT}
      GENAI_API_URL: ${GENAI_API_URL:-}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      GENAI_TIMEOUT: ${GENAI_TIMEOUT:-60}
      CV_CONF_LIMIAR: ${CV_CONF_LIMIAR:-0.35}
    ports:
      - "8000:8000"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - "/:/host:ro,rslave"
    networks: [internal]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
