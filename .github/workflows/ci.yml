name: DevSecOps CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: docker compose config -q
      - run: docker compose build backend frontend
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error backend frontend
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true}
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.17.0"}
      - run: terraform -chdir=terraform-azure fmt -check
      - run: terraform -chdir=terraform-azure init -backend=false
      - run: terraform -chdir=terraform-azure validate
  deploy-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, gitleaks, semgrep, trivy, terraform-validate]
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/brunoventuri01/zelacidade-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/brunoventuri01/zelacidade-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy approved container to Azure App Service
        run: |
          az webapp config container set \
            --resource-group rg-zelacidade-gs-99431 \
            --name app-zelacidade-gs-99431 \
            --container-image-name "$IMAGE" \
            --container-registry-url https://ghcr.io
          az webapp restart \
            --resource-group rg-zelacidade-gs-99431 \
            --name app-zelacidade-gs-99431
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 \
            https://app-zelacidade-gs-99431.azurewebsites.net

